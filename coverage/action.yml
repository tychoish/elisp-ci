name: "Emacs Lisp Coverage Runner"
description: "Run ERT test suite with under-cover code coverage measurement and summary rendering."
author: "sam kleinman <sam@tychoish.com>"

inputs:
  dependencies:
    description: "ELPA packages to install (space/comma-delimited string or multiline string)."
    required: false
    default: ""
  source-files:
    description: "Source files or globs to instrument for coverage (space/comma-delimited string or multiline string)."
    required: false
    default: "*.el"
  test-files:
    description: "ERT test files or globs (space/comma-delimited string or multiline string)."
    required: false
    default: "test/test-*.el"
  load-paths:
    description: "Directories to prepend to load-path (space/comma-delimited string or multiline string)."
    required: false
    default: "."
  report-format:
    description: "Coverage format: simplecov, lcov, coveralls, or text."
    required: false
    default: "simplecov"
  output-file:
    description: "Output path to write coverage artifact file."
    required: false
    default: "coverage.json"
  archives:
    description: "Package archives to enable (space/comma-delimited string)."
    required: false
    default: "gnu nongnu melpa elpaish"
  unsigned-archives:
    description: "Package archives allowed without GPG signatures (space/comma-delimited string)."
    required: false
    default: "elpaish"
  keyring-url:
    description: "URL to fetch GPG keyring."
    required: false
    default: "https://tychoish.github.io/elpaish/elpaish-keyring.gpg"

  fallback-mirrors:
    description: "Use fallback mirrors (e.g. USTC) for GNU and NonGNU ELPA by default (true/false)."
    required: false
    default: "true"

  gnu-mirror:
    description: "Custom URL or mirror shortcut (ustc, tuna, bfsu, upstream, none) for GNU ELPA."
    required: false
    default: ""
  nongnu-mirror:
    description: "Custom URL or mirror shortcut (ustc, tuna, bfsu) for NonGNU ELPA."
    required: false
    default: ""
runs:
  using: "composite"
  steps:
    - name: Run Emacs Lisp Coverage
      shell: bash
      env:
        INPUT_DEPENDENCIES: ${{ inputs.dependencies }}
        INPUT_TEST_FILES: ${{ inputs.test-files }}
        INPUT_SOURCE_FILES: ${{ inputs.source-files }}
        INPUT_LOAD_PATHS: ${{ inputs.load-paths }}
        INPUT_REPORT_FORMAT: ${{ inputs.report-format }}
        INPUT_OUTPUT_FILE: ${{ inputs.output-file }}
        INPUT_ARCHIVES: ${{ inputs.archives }}
        INPUT_UNSIGNED_ARCHIVES: ${{ inputs.unsigned-archives }}
        INPUT_KEYRING_URL: ${{ inputs.keyring-url }}
        INPUT_FALLBACK_MIRRORS: ${{ inputs.fallback-mirrors }}
        INPUT_GNU_MIRROR: ${{ inputs.gnu-mirror }}
        INPUT_NONGNU_MIRROR: ${{ inputs.nongnu-mirror }}
      run: |
        SCRIPT_PATH="${{ github.action_path }}/../scripts/run-coverage.el"
        if [ ! -f "$SCRIPT_PATH" ]; then
          SCRIPT_PATH="/__w/${SCRIPT_PATH#/home/runner/work/}"
        fi
        if [ ! -f "$SCRIPT_PATH" ] && [ -n "${GITHUB_ACTION_PATH:-}" ]; then
          SCRIPT_PATH="${GITHUB_ACTION_PATH}/../scripts/run-coverage.el"
        fi
        if [ ! -f "$SCRIPT_PATH" ]; then
          SCRIPT_PATH="${GITHUB_WORKSPACE}/scripts/run-coverage.el"
        fi
        emacs --batch -l "$SCRIPT_PATH"
