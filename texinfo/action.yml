name: "Ensure Texinfo Tools"
description: "Ensure texinfo (makeinfo and install-info) tools are installed on runner host or inside CI containers."
author: "sam kleinman <sam@tychoish.com>"

runs:
  using: "composite"
  steps:
    - name: Ensure makeinfo and install-info
      shell: bash
      run: |
        if which makeinfo >/dev/null 2>&1 && which install-info >/dev/null 2>&1; then
          echo "texinfo tools already present: $(which makeinfo), $(which install-info)"
          exit 0
        fi

        echo "texinfo tools missing; installing via system package manager..."
        SUDO=""
        if [ "$(id -u)" -ne 0 ] && which sudo >/dev/null 2>&1; then
          SUDO="sudo"
        fi

        if which apt-get >/dev/null 2>&1; then
          $SUDO apt-get update -qq && $SUDO apt-get install -y --no-install-recommends texinfo install-info
        elif which apk >/dev/null 2>&1; then
          $SUDO apk add --no-cache texinfo
        elif which brew >/dev/null 2>&1; then
          brew install texinfo
        elif which pacman >/dev/null 2>&1; then
          $SUDO pacman -Sy --noconfirm texinfo
        elif which dnf >/dev/null 2>&1; then
          $SUDO dnf install -y texinfo
        else
          echo "Warning: no supported package manager found to install texinfo." >&2
          exit 1
        fi
